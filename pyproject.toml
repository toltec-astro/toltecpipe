[project]
name = "toltecpipe"
dynamic = ["version"]
description = "TolTEC data acquisition pipeline and quick-look reduction dispatcher."
readme = "README.md"
authors = [
  { name = "Zhiyuan Ma", email = "zhiyuanma@umass.edu" },
]
maintainers = [
  { name = "Zhiyuan Ma", email = "zhiyuanma@umass.edu" },
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">= 3.13"
dependencies = [
  "dagster>=1.10.0",
  "dagster-webserver>=1.10.0",
  "dagster-postgres>=0.26.0",
  "pymysql>=1.1.0",
  "pydantic>=2.12.0",
  "pydantic-settings>=2.0.0",
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0",
  "loguru>=0.7.0",
  "typer>=0.20.0",
  "tenacity>=8.0.0",
]
classifiers = [
  "Typing :: Typed",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
]

[dependency-groups]
test = [
  "pytest",
  "pytest-doctestplus",
  "pytest-remotedata",
  "pytest-benchmark",
  "coverage",
  "ruff",
  "pre-commit",
  "ty",
]

dev = [
  { include-group = "test" },
  { include-group = "docs" },
  "pandas-stubs",
  "narwhals",
  "ipdb",
]

docs = [
  "myst-parser",
  "sphinx",
  "sphinx-astropy[confv2]",
  "sphinx-copybutton",
  "sphinx_book_theme",
  "autodoc_pydantic[erdantic]",
  "sphinxcontrib-typer",
  "sphinx-autobuild",
  "ghp-import",
]

[project.urls]
bugs = "https://github.com/toltec-astro/toltecpipe/issues"
changelog = "https://github.com/toltec-astro/toltecpipe/releases"
documentation = "https://toltec-astro.github.io/toltecpipe/"
homepage = "https://github.com/toltec-astro/toltecpipe"

[project.scripts]
toltecpipe = "toltecpipe.cli:app"

[build-system]
requires = ["setuptools>=80", "setuptools_scm>=8"]
build-backend = 'setuptools.build_meta'

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"*" = [
  "data/*",
  "data/*/*",
  "data/*/*/*",
  "data/*/*/*/*",
  "data/*/*/*/*/*",
  "data/*/*/*/*/*/*",
]

[tool.setuptools_scm]
version_file = "src/toltecpipe/_version.py"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests", "docs"]
norecursedirs = [".*", "docs[\\/]_build", "docs[\\/]generated", "examples"]
doctest_plus = "enabled"
text_file_format = "rst"
remote_data_strict = true
addopts = [
  "-ra",
  "--color=yes",
  "--doctest-rst",
  "--strict-config",
  "--strict-markers",
  "-p no:legacypath",
  "-p no:cacheprovider",
]
log_cli_level = "INFO"
xfail_strict = "true"
filterwarnings = ["error"]

[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Example override: relax a rule for the entire project (uncomment if needed).
# rules.TY015 = "warn"  # For invalid-argument-type, warn instead of error.

[tool.ty.src]
exclude = ["docs/conf.py"]

[tool.ruff]
line-length = 88
exclude = ["src/toltecpipe/_version.py"]
lint.future-annotations = true
lint.select = ["ALL"]
lint.ignore = [
  # flake8-builtins (A) : shadowing a Python built-in.
  # New ones should be avoided and is up to maintainers to enforce.
  "A00",
  "ARG001", # unused-function-argument
  "ARG002", # unused-method-argument
  "ARG003", # unused-class-method-argument
  "ARG004", # unused-static-method-argument
  "ARG005", # unused-lambda-argument
  "SLF001", # private member access
  "TID252", # relative imports
  "ANN401", # using Any type annotation
  "ANN002", # missing type args
  "ANN003", # missing type kwargs
  "D102",   # missing docs in public method
  "D105",   # missing docs in magic method
  "TRY003", # f-string in exception
  "ERA001", # commented out code
  "FIX002", # todo comments
  "FIX004", # hack comments
  "TD002",  # todo missing author
  "TD003",  # todo missing issue
  "G004",   # f-string in logging
  "N806",   # non-lowercase variable name
  "S101",   # use of assert; needed for narrowing types
  "COM812", # trailing comma (conflicts with ruff formatter)
  "ISC001", # implicit string concatenation (conflicts with ruff formatter)
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = [
  "D",       # pydocstyle
  "ERA001",  # commented out code
  "PLR2004", # magic value comparison
  "E721",    # type comparison using type()
  "PT011",   # pytest-raises-too-broad
  "PT018",   # pytest-composite-assertion
  "RUF043",  # pytest regex
  "PLC0415", # not top level imports
  "ANN202",  # missing return type annotation
  "F841",    # local variable assigned but never used
  "S108",    # /tmp paths are fine in tests
  "S603",    # subprocess of local scripts is fine in tests
  "PLW1510", # subprocess.run without check is fine in tests
]

"docs/conf.py" = [
  "D",      # pydocstyle
  "ERA001", # commented out code
  "INP001", # implicit namespace package (docs/ has no __init__.py)
]

[tool.ruff.lint.flake8-annotations]
ignore-fully-untyped = true

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "sqlalchemy.orm.DeclarativeBase",
]
runtime-evaluated-decorators = ["pydantic.validate_call"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.coverage.run]
branch = true
parallel = true
source = ["src/toltecpipe"]
omit = ["*/tests/*", "*/test_*", "*/_version.py", "*/conftest.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 50
exclude_also = [
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "@abstractmethod",
  "@overload",
  "except.*Error.*:",
  "except.*Exception.*:",
]

[tool.repo-review]
ignore = [
  "PY007", # ignore task runner
  "PC111", # ignore blacken-docs
  "PC140", # ignore type checker
  "PC180", # ignore markdown formatter
  "PC901", # ignore custom update message
  "MY",    # ignore mypy
  "RTD",   # ignore RTD
  "SCFG",  # ignore setup.cfg
  "GH",    # ignore GitHub Actions (no workflows by default)
]

[tool.codespell]
ignore-words-list = """
fo
"""

[tool.uv]
package = true
default-groups = ['dev']
cache-keys = [
  { file = "pyproject.toml" },
  { git = { commit = true, tags = true } },
]

[tool.dagster]
module_name = "toltecpipe.dagster.definitions"

[tool.cruft]
skip = [".git"]
