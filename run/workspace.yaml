# workspace.yaml — Dagster code location configuration
#
# Single-machine (local dev):
#   Uses python_package directly — no gRPC server needed.
#   Run: dagster dev (picks up pyproject.toml [tool.dagster] automatically)
#
# Two-machine production deployment:
#   Uncomment the grpc_server section and comment out python_package.
#   Each machine runs:
#     dagster api grpc --host 0.0.0.0 --port 4266 -m toltecpipe.dagster.definitions
#   Both machines share one PostgreSQL Dagster backend via dagster.yaml.

# --- Single machine (dev / local) ---
load_from:
  - python_package:
      package_name: toltecpipe
      attribute: toltecpipe.dagster.definitions:defs
      location_name: toltecpipe

